<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NE1 · Balneabilidade → CSV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏖️%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="hd"><img alt="NE1" src="assets/logo-ne1.png"><div><h1>Qualidade da água nas praias</h1><p>Informativo de balneabilidade (CPRH) → CSV</p></div></div></header>
<main>
<p style="color:#12304d;margin:0 0 14px">Envie o PDF do informativo de balneabilidade da CPRH.</p>

<div class="card">
  <div id="drop"><b>Clique ou arraste</b> o PDF do informativo aqui</div>
  <input id="file" type="file" accept="application/pdf" hidden>
  <div id="msg"></div>
</div>

<div class="card" id="res" hidden>
  <div class="row" style="margin-bottom:12px">
    <div><label for="dt">Data do documento</label><input id="dt" type="text" placeholder="dd/mm/aaaa"></div>
    <div><small id="meta"></small></div>
  </div>
  <div class="tw"><table><thead><tr><th>#</th><th>Praia</th><th>Código</th><th>Classificação</th><th>Imprópria</th></tr></thead><tbody id="tb"></tbody></table></div>
  <p><small>Clique na classificação para corrigir qualquer leitura errada.</small></p>
  <div class="row"><button id="dl" class="p">Baixar CSV</button><button id="cp" class="g">Copiar CSV</button><small id="cnt"></small></div>
</div>
</main>

<script src="vendor/pdf.min.js"></script>
<script src="js/praias.js"></script>
<script src="js/app.js"></script>
</body>
</html>
